name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-3.0 xdotool xvfb x11-utils dbus-x11
        pip install pytest

    - name: Run script in xvfb
      run: |
        # Setup fake X11 environment to allow script to run
        export DISPLAY=:99
        Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
        sleep 2
        
        # Test if the script can parse without syntax errors
        python3 -m py_compile chrome_dock_profiles.py
        
        # Test the wrapper script syntax
        bash -n src/linux_toolbox/resources/scripts/chrome-profile-launch.sh
        
        # We can also add dummy python tests here if any exist
