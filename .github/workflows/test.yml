name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-3.0 xdotool xvfb x11-utils dbus-x11

    - name: Run installer
      run: |
        chmod +x install.sh
        ./install.sh

    - name: Test headless execution and file generation
      run: |
        # Setup fake X11 environment to allow script to run
        export DISPLAY=:99
        Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
        sleep 2
        
        # Test if the script can parse without syntax errors
        python3 -m py_compile chrome_dock_profiles.py
        
        # We need fake Chrome profiles to test generation
        mkdir -p ~/.config/google-chrome/Default
        touch ~/.config/google-chrome/Local\ State
        echo '{"profile":{"info_cache":{"Default":{"name":"Test Profile"}}}}' > ~/.config/google-chrome/Local\ State
        
        # Run the application headlessly to trigger profile launcher generation
        # We use a small python snippet to trigger the profile installation directly
        python3 -c '
        import sys, os
        sys.path.append(f"{os.environ[\"HOME\"]}/.local/share/chrome-dock-profiles")
        import gi
        gi.require_version("Gtk", "3.0")
        from gi.repository import Gtk
        # Bypass GUI and run the launcher generation directly
        import chrome_dock_profiles
        app = chrome_dock_profiles.App(application=Gtk.Application())
        app.install_profile_launchers()
        ' || true # Gtk.Application might complain without a proper main loop, but we just need it to run

    - name: Validate generated files
      run: |
        echo "Validating desktop files..."
        ls -la ~/.local/share/applications/google-chrome-profile*.desktop
        
        echo "Validating wrapper script..."
        ls -la ~/.local/bin/chrome-profile-launch
        
        echo "Validating script syntax..."
        bash -n ~/.local/bin/chrome-profile-launch
